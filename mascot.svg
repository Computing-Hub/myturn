<?xml version="1.0" encoding="utf-8"?>
<!--
  MyTurn mascot — a Jersey cow.
  Front-facing portrait of the iconic Jersey breed: light fawn coat,
  dark eye-rings, cream muzzle, two little horns and a forehead curl.
  Renders crisp at 64×64 in the home hero and larger on the lesson-
  complete screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Jersey cow mascot">
  <defs>
    <radialGradient id="mt-face" cx="50%" cy="35%" r="70%">
      <stop offset="0%"  stop-color="#f0d4ad"/>
      <stop offset="65%" stop-color="#d6a978"/>
      <stop offset="100%" stop-color="#b07f4c"/>
    </radialGradient>
    <radialGradient id="mt-muzzle" cx="50%" cy="35%" r="70%">
      <stop offset="0%"  stop-color="#f4e2d2"/>
      <stop offset="100%" stop-color="#b89a86"/>
    </radialGradient>
    <linearGradient id="mt-horn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fbeecd"/>
      <stop offset="100%" stop-color="#b89a5f"/>
    </linearGradient>
    <linearGradient id="mt-ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#dfa472"/>
      <stop offset="100%" stop-color="#9a6a3a"/>
    </linearGradient>
    <linearGradient id="mt-earIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f3c5a0"/>
      <stop offset="100%" stop-color="#c08c6a"/>
    </linearGradient>
  </defs>

  <!-- Ears (drawn first so the head sits over their base) -->
  <path d="M 24 48 Q 4 42 10 66 Q 24 76 40 64 Z" fill="url(#mt-ear)" stroke="#7a4e26" stroke-width="1.2"/>
  <path d="M 26 52 Q 12 50 16 64 Q 24 70 36 62 Z" fill="url(#mt-earIn)"/>
  <path d="M 104 48 Q 124 42 118 66 Q 104 76 88 64 Z" fill="url(#mt-ear)" stroke="#7a4e26" stroke-width="1.2"/>
  <path d="M 102 52 Q 116 50 112 64 Q 104 70 92 62 Z" fill="url(#mt-earIn)"/>

  <!-- Horns (between the ears, peeking above the head) -->
  <path d="M 44 40 Q 38 22 50 22 Q 52 32 52 42 Z" fill="url(#mt-horn)" stroke="#8a6f3a" stroke-width="1"/>
  <path d="M 84 40 Q 90 22 78 22 Q 76 32 76 42 Z" fill="url(#mt-horn)" stroke="#8a6f3a" stroke-width="1"/>

  <!-- Head -->
  <path d="M 30 58
           Q 28 36 50 32
           Q 64 28 78 32
           Q 100 36 98 58
           Q 100 78 92 90
           Q 80 100 64 100
           Q 48 100 36 90
           Q 28 78 30 58 Z"
        fill="url(#mt-face)" stroke="#7a4e26" stroke-width="1.5"/>

  <!-- Forehead curl — the trademark Jersey tuft -->
  <path d="M 56 38 Q 60 28 64 32 Q 68 28 72 38 Q 68 42 64 40 Q 60 42 56 38 Z" fill="#7a4e26"/>

  <!-- Eye sockets (darker fawn ring — classic doe-eyed Jersey look) -->
  <ellipse cx="46" cy="62" rx="11" ry="12" fill="#8a5f33" opacity="0.85"/>
  <ellipse cx="82" cy="62" rx="11" ry="12" fill="#8a5f33" opacity="0.85"/>

  <!-- Eyes -->
  <ellipse cx="46" cy="63" rx="7" ry="8.5" fill="#1f1208"/>
  <ellipse cx="82" cy="63" rx="7" ry="8.5" fill="#1f1208"/>

  <!-- Eye highlights -->
  <ellipse cx="48.5" cy="59" rx="2.4" ry="2.8" fill="#ffffff"/>
  <ellipse cx="84.5" cy="59" rx="2.4" ry="2.8" fill="#ffffff"/>
  <circle cx="43.5" cy="66" r="1.1" fill="#ffffff" opacity="0.6"/>
  <circle cx="79.5" cy="66" r="1.1" fill="#ffffff" opacity="0.6"/>

  <!-- Cheek blush -->
  <ellipse cx="36" cy="80" rx="6" ry="4" fill="#e8927a" opacity="0.55"/>
  <ellipse cx="92" cy="80" rx="6" ry="4" fill="#e8927a" opacity="0.55"/>

  <!-- Muzzle -->
  <path d="M 42 84
           Q 36 88 38 96
           Q 48 104 64 104
           Q 80 104 90 96
           Q 92 88 86 84
           Q 74 78 64 78
           Q 54 78 42 84 Z"
        fill="url(#mt-muzzle)" stroke="#8a6a52" stroke-width="1.2"/>

  <!-- Nostrils -->
  <ellipse cx="55" cy="89" rx="2.4" ry="3.4" fill="#3a2418"/>
  <ellipse cx="73" cy="89" rx="2.4" ry="3.4" fill="#3a2418"/>

  <!-- Smile -->
  <path d="M 54 97 Q 64 103 74 97" stroke="#4a2e1c" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
